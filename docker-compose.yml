services:
  postgres:
    image: postgres:16
    container_name: easterprizecms-postgres
    environment:
      POSTGRES_DB: easterprizecms
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - easterprizecms_data:/var/lib/postgresql/data


volumes:
  easterprizecms_data: