services:
  postgres:
    image: postgres:16
    container_name: easterprizecms-postgres
    environment:
      POSTGRES_DB: easterprizecms
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - easterprizecms_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: easterprizecms-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  easterprizecms_data: